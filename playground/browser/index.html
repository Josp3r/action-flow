<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ActionFlow · 浏览器兼容性验收</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; }
    body { max-width: 760px; margin: 8vh auto; padding: 0 24px; }
    h1 { font-size: 28px; letter-spacing: -.04em; }
    button { font: inherit; padding: 8px 16px; cursor: pointer; }
    li { margin: 10px 0; }
    code { font-family: ui-monospace, monospace; }
    #summary { font-weight: 600; }
  </style>
</head>
<body>
  <p>ActionFlow / Browser compatibility</p>
  <h1>在真实浏览器中验证 Core</h1>
  <p>直接加载构建后的 ESM 产物，检查 Core、执行追踪、Middleware 和协作取消。</p>
  <button id="run" type="button">重新运行验收</button>
  <p id="summary" role="status" aria-live="polite">正在运行…</p>
  <ol id="results"></ol>
  <script type="module">
    const summary = document.querySelector("#summary");
    const results = document.querySelector("#results");
    const button = document.querySelector("#run");
    async function run() {
      results.replaceChildren();
      button.disabled = true;
      summary.textContent = "正在运行…";
      let passed = 0;
      let failed = 0;
      const check = async (name, execute) => {
        const item = document.createElement("li");
        try {
          await execute();
          item.textContent = `通过 · ${name}`;
          passed++;
        } catch (error) {
          item.textContent = `失败 · ${name}：${error instanceof Error ? error.message : String(error)}`;
          failed++;
        }
        results.append(item);
      };
      const assert = (condition, message) => { if (!condition) throw new Error(message); };
      try {
        const { createRuntime, createActionFactory, defineAction, defineModule, DuplicateActionError, UnknownActionError } =
          await import("/packages/core/dist/index.js");
        const action = createActionFactory();
        const failure = new Error("Expected failure");
        const module = defineModule("browser", {
          echo: action.define({ handler: (input, ctx) => `${ctx.providers.prefix}:${input}` }),
          parent: action.define({ handler: (input, ctx) => ctx.dispatch("browser.echo", input) }),
          fail: defineAction({ handler: () => { throw failure; } }),
        });
        const runtime = createRuntime({ providers: { prefix: "web" }, modules: [module] });
        await check("ESM 导入与 Registry", () => {
          assert(runtime.registry.size === 3 && runtime.registry.has("browser.echo"), "Registry mismatch");
        });
        await check("依赖注入与同步结果", async () => {
          assert(await runtime.dispatch("browser.echo", "hello") === "web:hello", "Provider mismatch");
        });
        await check("嵌套调用", async () => {
          assert(await runtime.dispatch("browser.parent", "nested") === "web:nested", "Nested result mismatch");
        });
        await check("并发结果关联", async () => {
          const values = await Promise.all([runtime.dispatch("browser.echo", "one"), runtime.dispatch("browser.echo", "two")]);
          assert(values.join(",") === "web:one,web:two", "Concurrent result mismatch");
        });
        await check("原始异常传播", async () => {
          let actual;
          try { await runtime.dispatch("browser.fail"); } catch (error) { actual = error; }
          assert(actual === failure, "Error identity mismatch");
        });
        await check("未知 Action 拒绝", async () => {
          let actual;
          try { await runtime.dispatch("missing.action"); } catch (error) { actual = error; }
          assert(actual instanceof UnknownActionError, "Unknown Action was accepted");
        });
        await check("重复 Action 拒绝", () => {
          let actual;
          try { createRuntime({ providers: {}, modules: [module, module] }); } catch (error) { actual = error; }
          assert(actual instanceof DuplicateActionError, "Duplicate Action was accepted");
        });
        await check("并发 Trace 的父子关系与生命周期", async () => {
          const traced = createRuntime({ providers: { prefix: "trace" }, modules: [module], environment: "test" });
          const events = [];
          const unsubscribe = traced.trace.subscribe((event) => events.push(event.type));
          await Promise.all([traced.dispatch("browser.parent", "one"), traced.dispatch("browser.parent", "two")]);
          unsubscribe();
          const records = traced.trace.list();
          const roots = records.filter((record) => record.parentExecutionId === undefined);
          assert(records.length === 4 && roots.length === 2, "Execution count mismatch");
          assert(roots[0].traceId !== roots[1].traceId, "Concurrent traces were mixed");
          for (const root of roots) {
            const tree = traced.trace.getTrace(root.traceId);
            assert(tree.length === 2 && tree[1].parentExecutionId === root.executionId, "Parent linkage mismatch");
          }
          assert(records.every((record) => record.status === "success"), "Invalid terminal state");
          assert(events.filter((type) => type === "start").length === 4 && events.filter((type) => type === "finish").length === 4, "Lifecycle event mismatch");
        });
        await check("追踪脱敏与业务数据保持原样", async () => {
          const traced = createRuntime({ providers: {}, trace: { capture: { input: true, output: true } }, modules: [defineModule("capture", {
            echo: defineAction({ handler: (input) => input }),
          })] });
          const input = { name: "Ada", password: "secret" };
          const output = await traced.dispatch("capture.echo", input);
          const record = traced.trace.list()[0];
          assert(output === input && input.password === "secret", "Business value was changed");
          assert(record.input.password === "[REDACTED]" && record.output.password === "[REDACTED]", "Secrets were captured");
        });
        await check("Middleware 洋葱执行顺序", async () => {
          const order = [];
          const wrapped = createRuntime({ providers: { prefix: "wrapped" }, modules: [module], middleware: [
            async (_, next) => { order.push("outer:before"); const value = await next(); order.push("outer:after"); return value; },
            async (_, next) => { order.push("inner:before"); const value = await next(); order.push("inner:after"); return value; },
          ] });
          assert(await wrapped.dispatch("browser.echo", "value") === "wrapped:value", "Middleware changed the result");
          assert(order.join(",") === "outer:before,inner:before,inner:after,outer:after", "Middleware order mismatch");
        });
        await check("AbortSignal 与 cancelled 执行状态", async () => {
          const traced = createRuntime({ providers: { prefix: "cancel" }, modules: [module], trace: true });
          const controller = new AbortController();
          controller.abort("cancelled by browser check");
          let actual;
          try { await traced.dispatch("browser.echo", "value", { signal: controller.signal }); }
          catch (error) { actual = error; }
          assert(actual === controller.signal.reason, "Abort reason was changed");
          assert(traced.trace.list()[0].status === "cancelled", "Cancellation state mismatch");
        });
      } catch (error) {
        failed++;
        const item = document.createElement("li");
        item.textContent = `加载失败：${error instanceof Error ? error.message : String(error)}`;
        results.append(item);
      } finally {
        summary.textContent = `${passed} 项通过，${failed} 项失败`;
        document.documentElement.dataset.testStatus = failed ? "failed" : "passed";
        button.disabled = false;
      }
    }
    button.addEventListener("click", run);
    await run();
  </script>
</body>
</html>
